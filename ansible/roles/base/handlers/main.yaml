# The template task validates the drop-in alone; this checks it together with the
# rest of the config before sshd picks it up.
- name: Check the full sshd config
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload sshd

- name: Reload ssh.service
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Reload sshd
