- name: Install the deploy script
  ansible.builtin.copy:
    src: deploy.py
    dest: /usr/local/bin/deploy
    owner: root
    group: root
    mode: "0755"

- name: Create /etc/deploy
  ansible.builtin.file:
    path: /etc/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the list of projects to deploy
  ansible.builtin.copy:
    content: "{{ deploy_projects | to_nice_json }}\n"
    dest: /etc/deploy/projects.json
    owner: root
    group: root
    mode: "0644"

- name: Install the deploy units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: [deploy.service, deploy.path, deploy.timer]
  register: deploy_units
  notify: Restart the deploy triggers

# Starting the timer after boot runs a deploy at once, since OnBootSec has
# passed; later runs find it already started.
- name: Deploy on webhook triggers and after boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    # A reload alone isn't reported as a change.
    daemon_reload: "{{ deploy_units is changed }}"
  loop: [deploy.path, deploy.timer]
