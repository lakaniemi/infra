server_name: hobby
server_type: cpx12
server_location: hel1
server_image: ubuntu-24.04
managed_labels:
  managed-by: ansible-infra

ssh_key_name: hetzner-ssh-key
# The private key never leaves 1Password; its SSH agent signs logins.
ssh_public_key: "{{ lookup('ansible.builtin.pipe', 'op read \"op://Private/hetzner-ssh-key/public key\"') }}"

# Written by scripts/set-home-ip.sh.
home_ip: "{{ vault_home_ip }}"

firewall_name: hobby
firewall_rules:
  - description: http
    direction: in
    protocol: tcp
    port: "80"
    source_ips: [0.0.0.0/0, "::/0"]
  - description: https
    direction: in
    protocol: tcp
    port: "443"
    source_ips: [0.0.0.0/0, "::/0"]
  - description: icmp
    direction: in
    protocol: icmp
    source_ips: [0.0.0.0/0, "::/0"]
  - description: home
    direction: in
    protocol: tcp
    port: "22"
    source_ips: ["{{ home_ip }}/32"]
