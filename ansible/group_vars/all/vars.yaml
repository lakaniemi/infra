server_name: hobby
server_type: cpx12
server_location: hel1
# Used only when the server is created or rebuilt (provision.yaml --tags rebuild).
# Move to a new LTS once its first point release (e.g. 26.04.1) is out.
server_image: ubuntu-26.04
managed_labels:
  managed-by: ansible-infra

ssh_key_name: hetzner-ssh-key
# The private key never leaves 1Password; its SSH agent signs logins.
ssh_public_key: "{{ lookup('ansible.builtin.pipe', 'op read \"op://Private/hetzner-ssh-key/public key\"') }}"

# Written by scripts/set-home-ip.sh.
home_ip: "{{ vault_home_ip }}"

admin_user: valtteri
admin_password: "{{ vault_admin_password }}"
admin_password_salt: "{{ vault_admin_password_salt }}"

postgres_password: "{{ vault_postgres_password }}"

life_app_db_password: "{{ vault_life_app_db_password }}"
# The Google OAuth Web client IDs whose sign-ins the API accepts, comma-separated.
life_app_google_client_ids: "{{ vault_life_app_google_client_ids }}"

# Each hook is POST https://webhooks.lakaniemi.com/<hook>, with its own token
# (WEBHOOK_<HOOK>_TOKEN in the stack's .env) and trigger directory.
webhook_hooks: [deploy]
# Also stored as a GitHub Actions secret in each project repo that deploys.
webhook_deploy_token: "{{ vault_webhook_deploy_token }}"

# Projects that deploy.py deploys from their image's :production tag. The image
# each one runs is kept in /var/lib/deploy/<name>.env, which the project's
# include in stack/compose.yaml reads.
deploy_projects:
  - name: life-app
    image: ghcr.io/lakaniemi/life-app-api
    service: life-app-api
    health_url: https://life-app-api.lakaniemi.com/health

firewall_name: hobby
firewall_rules:
  - description: http
    direction: in
    protocol: tcp
    port: "80"
    source_ips: [0.0.0.0/0, "::/0"]
  - description: https
    direction: in
    protocol: tcp
    port: "443"
    source_ips: [0.0.0.0/0, "::/0"]
  - description: icmp
    direction: in
    protocol: icmp
    source_ips: [0.0.0.0/0, "::/0"]
  - description: home
    direction: in
    protocol: tcp
    port: "22"
    source_ips: ["{{ home_ip }}/32"]
