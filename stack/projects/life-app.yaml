services:
  # No restart policy: it runs once per `up` and isn't started again at boot.
  life-app-migrate:
    image: ${LIFE_APP_IMAGE:?}
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: ${LIFE_APP_DATABASE_URL:?}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]

  life-app-api:
    image: ${LIFE_APP_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LIFE_APP_DATABASE_URL:?}
      GOOGLE_CLIENT_IDS: ${LIFE_APP_GOOGLE_CLIENT_IDS:?}
    depends_on:
      life-app-migrate:
        condition: service_completed_successfully
    networks: [web, db]
