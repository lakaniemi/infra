name: hobby

services:
  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The directory, not the file: Ansible replaces the Caddyfile by renaming
      # a new file over it, and a single-file mount would keep the old one.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Read by postgres/init/, which creates each project's role.
      LIFE_APP_DB_PASSWORD: ${LIFE_APP_DB_PASSWORD:?}
    volumes:
      # PG18 images keep data in a version-specific subdirectory of this path.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while the init scripts run, Postgres listens only on its
      # Unix socket, and isn't ready for the other containers yet.
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 1s
    networks: [db]

  # Internet-facing through Caddy, so it gets no privileges: its only effect is
  # creating trigger files under /var/lib/webhooks for the host's .path units.
  webhooks:
    image: python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    restart: unless-stopped
    command: ["python", "/app/listener.py"]
    # Python as PID 1 would ignore SIGTERM, delaying every stop by 10 seconds.
    init: true
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WEBHOOK_DEPLOY_TOKEN: ${WEBHOOK_DEPLOY_TOKEN:?}
    volumes:
      - ./webhooks:/app:ro
      - /var/lib/webhooks:/hooks
    networks: [web]

# Each project is listed: include takes no wildcards. env_file adds the image
# deploy.py last deployed to the variables from .env.
include:
  - path: projects/life-app.yaml
    env_file: /var/lib/deploy/life-app.env

networks:
  web:
  db:
    # Postgres needs no internet access.
    internal: true

volumes:
  caddy_data:
  caddy_config:
  pgdata:
