[defaults]
inventory = ansible/inventory/hcloud.yaml
vault_password_file = scripts/vault-password.sh
# Lets ad-hoc commands such as `ansible hobby -m ...` load ansible/group_vars,
# which otherwise only playbooks next to it load.
playbook_dir = ansible
# Use the collection versions pinned in ansible/requirements.yaml, not the ones bundled with Ansible.
collections_path = .ansible/collections
